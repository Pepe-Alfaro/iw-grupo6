[project]
name = "remarket-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "sqlmodel>=0.0.19",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "coverage[toml]>=7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
